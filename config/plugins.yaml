plugins:
  - class: app.plugins.memory_plugins.InMemoryMemoryPlugin
    enabled: true
    config: {}

  - class: app.plugins.memory_plugins.ChromaDBMemoryPlugin
    enabled: true
    config:
      path: ./chroma_db
      collection_name: memora_memories

  - class: app.plugins.model_plugins.GeminiModelPlugin
    enabled: true
    config:
      api_key: ${GEMINI_API_KEY}
      model_name: gemini-1.5-flash

  - class: app.plugins.model_plugins.OllamaModelPlugin
    enabled: true
    config:
      model_name: llama3.2
      base_url: http://localhost:11434

  - class: app.plugins.tool_plugins.CalculatorToolPlugin
    enabled: true
    config: {}

  - class: app.plugins.tool_plugins.TimeToolPlugin
    enabled: true
    config: {}

  - class: app.plugins.tool_plugins.WebSearchToolPlugin
    enabled: true
    config: {}

  - class: app.plugins.tool_plugins.SaveNoteToolPlugin
    enabled: true
    config:
      memory_plugin: chromadb_memory

  - class: app.plugins.tool_plugins.FileSystemToolPlugin
    enabled: true
    config:
      allowed_directories:
        - .
